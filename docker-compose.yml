name: mealcart

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mealcart}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-mealcart}
    ports:
      - "127.0.0.1:${MEALCART_DB_PORT:-5437}:5432"
    volumes:
      - mealcart_db_data:/var/lib/postgresql/data
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mealcart} -d ${POSTGRES_DB:-mealcart}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mealcart_db_data:
